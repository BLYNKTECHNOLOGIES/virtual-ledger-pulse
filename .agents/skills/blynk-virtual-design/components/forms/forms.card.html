<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-card);padding:18px 20px;margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Textarea, Select, Checkbox, Radio, Switch } = window.BlynkVirtualDesignSystem_efba8f;
function Demo(){
  const [c,setC]=React.useState(true); const [s,setS]=React.useState(true); const [p,setP]=React.useState('hourly');
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px 24px'}}>
    <Field label="Device name" hint="Shown in the fleet list."><Input defaultValue="Gateway-HAM-04" iconLeft="cpu"/></Field>
    <Field label="API key" error="That key is already in use." required><Input defaultValue="bv_live_9f2…" invalid/></Field>
    <Field label="Site"><Select options={["All sites","Hamburg","Rotterdam","Genoa"]} defaultValue="Hamburg"/></Field>
    <Field label="Notes"><Textarea rows={2} placeholder="What changed on this gateway?"/></Field>
    <div style={{display:'grid',gap:10}}>
      <Checkbox checked={c} onChange={setC} label="Email me when a device drops off"/>
      <Checkbox checked={false} onChange={()=>{}} label="Weekly digest"/>
      <Checkbox checked={true} disabled label="Disabled, checked"/>
    </div>
    <div style={{display:'grid',gap:10}}>
      <Radio value="hourly" checked={p==='hourly'} onChange={setP} label="Hourly polling"/>
      <Radio value="daily" checked={p==='daily'} onChange={setP} label="Daily polling"/>
      <Switch checked={s} onChange={setS} label="Auto-provision new gateways"/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
