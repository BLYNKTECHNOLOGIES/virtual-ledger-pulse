<!-- @dsCard group="Brand" viewport="700x185" name="Misuse" subtitle="Never recolour, stretch, outline or reset the wordmark" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);padding:16px 18px;font-family:var(--font-sans);height:185px;box-sizing:border-box;overflow:hidden}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-mono);font-size:9px}.lbl{font:var(--type-mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em}.grid{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
<div><div style="background:var(--neutral-50);border-radius:var(--radius-md);padding:16px;display:grid;place-items:center;height:82px"><img src="../assets/blynk-logo-horizontal.png" style="width:88%;filter:hue-rotate(120deg) saturate(2)"></div><div class="lbl" style="margin-top:7px;color:var(--danger-700)">✕ Recoloured</div></div>
<div><div style="background:var(--neutral-50);border-radius:var(--radius-md);padding:16px;display:grid;place-items:center;height:82px"><img src="../assets/blynk-logo-horizontal.png" style="width:88%;height:34px"></div><div class="lbl" style="margin-top:7px;color:var(--danger-700)">✕ Stretched</div></div>
<div><div style="background:var(--cyan-500);border-radius:var(--radius-md);padding:16px;display:grid;place-items:center;height:82px"><img src="../assets/blynk-logo-horizontal.png" style="width:88%"></div><div class="lbl" style="margin-top:7px;color:var(--danger-700)">✕ Black wordmark on cyan — use the white lockup</div></div>
</div></body></html>
