<!-- @dsCard group="Colors" viewport="700x160" name="Semantic" subtitle="Success, warning, danger, info — tint / base / deep" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);padding:16px 18px;font-family:var(--font-sans);height:160px;box-sizing:border-box;overflow:hidden}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-mono);font-size:9px}.lbl{font:var(--type-mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em}.grid{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div><div class="sw" style="border:0"><div style="background:var(--success-100);height:56px"></div><div style="background:var(--success-500);height:56px"></div><div style="background:var(--success-700);height:56px"></div></div><div class="lbl" style="margin-top:8px">--success-100 / 500 / 700</div></div><div><div class="sw" style="border:0"><div style="background:var(--warning-100);height:56px"></div><div style="background:var(--warning-500);height:56px"></div><div style="background:var(--warning-700);height:56px"></div></div><div class="lbl" style="margin-top:8px">--warning-100 / 500 / 700</div></div><div><div class="sw" style="border:0"><div style="background:var(--danger-100);height:56px"></div><div style="background:var(--danger-500);height:56px"></div><div style="background:var(--danger-700);height:56px"></div></div><div class="lbl" style="margin-top:8px">--danger-100 / 500 / 700</div></div><div><div class="sw" style="border:0"><div style="background:var(--info-100);height:56px"></div><div style="background:var(--info-500);height:56px"></div><div style="background:var(--info-700);height:56px"></div></div><div class="lbl" style="margin-top:8px">--info-100 / 500 / 700</div></div></div></body></html>
