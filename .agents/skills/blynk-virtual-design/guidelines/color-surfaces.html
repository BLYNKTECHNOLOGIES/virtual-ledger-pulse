<!-- @dsCard group="Colors" viewport="700x175" name="Surfaces & text" subtitle="Semantic aliases used in components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);padding:16px 18px;font-family:var(--font-sans);height:175px;box-sizing:border-box;overflow:hidden}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-mono);font-size:9px}.lbl{font:var(--type-mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em}.grid{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="background:var(--surface-page);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:14px">
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm);border-radius:var(--radius-md);padding:12px">
<div style="color:var(--text-heading);font-weight:700;font-size:14px">--text-heading on --surface-card</div>
<div style="color:var(--text-body);font-size:13px">--text-body</div>
<div style="color:var(--text-muted);font-size:12px">--text-muted</div>
<div style="color:var(--text-brand);font-size:12px;font-weight:600">--text-brand</div></div>
<div class="lbl" style="margin-top:8px">--surface-page → --surface-card</div></div>
<div style="background:var(--surface-inverse);border-radius:var(--radius-card);padding:14px">
<div style="color:var(--text-on-inverse);font-weight:700;font-size:14px">--text-on-inverse</div>
<div style="color:var(--text-on-inverse-muted);font-size:13px">--text-on-inverse-muted</div>
<div style="color:var(--cyan-300);font-size:12px;font-weight:600">--cyan-300 (accent on ink)</div>
<div class="lbl" style="margin-top:14px;color:var(--neutral-500)">--surface-inverse</div></div>
</div></body></html>
