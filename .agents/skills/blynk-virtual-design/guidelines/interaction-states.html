<!-- @dsCard group="Spacing" viewport="700x170" name="Interaction states" subtitle="Rest / hover / press / focus / disabled" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);padding:16px 18px;font-family:var(--font-sans);height:170px;box-sizing:border-box;overflow:hidden}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-mono);font-size:9px}.lbl{font:var(--type-mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em}.grid{display:grid;gap:10px}</style></head><body><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<div style="height:40px;padding:0 18px;border-radius:var(--radius-control);background:var(--cyan-500);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center">Rest</div>
<div style="height:40px;padding:0 18px;border-radius:var(--radius-control);background:var(--cyan-600);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;box-shadow:var(--shadow-brand);transform:translateY(-1px)">Hover</div>
<div style="height:40px;padding:0 18px;border-radius:var(--radius-control);background:var(--cyan-700);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;transform:scale(.985)">Press</div>
<div style="height:40px;padding:0 18px;border-radius:var(--radius-control);background:var(--cyan-500);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;box-shadow:var(--ring-focus)">Focus</div>
<div style="height:40px;padding:0 18px;border-radius:var(--radius-control);background:var(--cyan-500);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;opacity:.42">Disabled</div>
</div><div class="lbl" style="margin-top:12px">500 → 600 + glow + lift → 700 + scale(.985) · focus = 3px --focus-ring · disabled = 42% opacity</div></body></html>
