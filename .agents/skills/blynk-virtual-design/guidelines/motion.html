<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="Durations and the standard easing curve" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-card);padding:16px 18px;font-family:var(--font-sans);height:160px;box-sizing:border-box;overflow:hidden}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-mono);font-size:9px}.lbl{font:var(--type-mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em}.grid{display:grid;gap:10px}</style></head><body><div style="display:grid;gap:8px">
<div style="display:flex;gap:8px;align-items:center"><div style="width:180px;height:6px;border-radius:999px;background:var(--neutral-100);overflow:hidden"><div style="height:6px;background:var(--cyan-500);animation:sl 1.4s cubic-bezier(.2,.8,.25,1) infinite;width:40%"></div></div><div class="lbl">--ease-standard cubic-bezier(.2,.8,.25,1)</div></div>
<div class="lbl">instant 80ms · fast 140ms (controls) · base 220ms (surfaces) · slow 360ms (page) · slower 600ms (loops)</div>
<div class="lbl">hover: translateY(-1px) · press: scale(.985) · no bounce, no spring, no parallax</div>
<style>@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style></div></body></html>
